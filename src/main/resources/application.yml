spring:
  application:
    name: code-mentor

server:
  port: 8081
  servlet:
    context-path: /api

# 模型密钥统一从环境变量读取，仓库内不保留任何 key
langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: ${QWEN_MODEL:qwen-max}
        api-key: ${DASHSCOPE_API_KEY:}
      streaming-chat-model:
        model-name: ${QWEN_MODEL:qwen-max}
        api-key: ${DASHSCOPE_API_KEY:}
      embedding-model:
        model-name: ${QWEN_EMBEDDING_MODEL:text-embedding-v4}
        api-key: ${DASHSCOPE_API_KEY:}

# 智谱联网搜索 MCP：默认关闭，配置 key 并置 enabled=true 才启用
bigmodel:
  api-key: ${BIGMODEL_API_KEY:}
  mcp:
    enabled: ${BIGMODEL_MCP_ENABLED:false}
